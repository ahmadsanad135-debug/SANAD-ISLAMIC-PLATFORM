
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة سند</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0b3d2e, #145c43, #1b7655);
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        .logo {
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            color: #f4d58d;
            font-size: 35px;
            font-weight: 800;
        }

        .subtitle {
            color: #e1eee6;
            margin: 10px 0 35px;
            font-size: 16px;
        }

        .card {
            display: block;
            text-decoration: none;
            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(244,213,141,0.5);
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 18px;
            color: white;
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.18);
            border-color: #f4d58d;
        }

        .card .icon {
            font-size: 35px;
            margin-bottom: 8px;
        }

        .card h2 {
            color: #f4d58d;
            font-size: 21px;
            margin-bottom: 5px;
        }

        .card p {
            font-size: 13px;
            color: #e1eee6;
        }

        footer {
            color: #c5d9ce;
            font-size: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <main class="container">

        <div class="logo">🌿</div>

        <h1>منصة سند</h1>

        <p class="subtitle">
            أهلاً بك، اختر الخدمة التي تريد الدخول إليها
        </p>

        <a class="card"
           href="https://sanad-e2fb2.web.app/index.html"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon">📖</div>
            <h2>مصحف سند</h2>
            <p>الدخول إلى المصحف الإلكتروني</p>

        </a>

        <a class="card"
           href="https://sanad-islamic-dhikr.web.app"
           target="_blank"
           rel="noopener noreferrer">

            <div class="icon">🤲</div>
            <h2>أذكار سند</h2>
            <p>الدخول إلى تطبيق الأذكار الإسلامية</p>

        </a>

        <footer>
            © 2026 منصة سند
            <br>
            نسأل الله القبول والنفع
        </footer>

    </main>

</body>
</html>
